{% extends 'base.html' %}
{% load static %}

{% block content %}

<h2 class="mb-4">
    Edit Renewal
</h2>

<div class="card shadow">
    <div class="card-body">

        <form method="POST" id="edit-form">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">Save & Close</button>
            <a href="{% url 'renewal_view' renewal.id %}" class="btn btn-secondary">Cancel</a>

            <a href="{% url 'renewal_delete' renewal.id %}" class="btn btn-danger float-end">
                Delete
            </a>
        </form>

    </div>
</div>

<script src="{% static 'js/autosave.js' %}"></script>

{% endblock %}
