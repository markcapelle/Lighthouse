{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2 class="mb-4">
    Edit Renewal
</h2>

<div class="card shadow">
    <div class="card-body">
        <form method="POST" id="edit-form">
            {% csrf_token %}
            {% include 'renewal-fields.html' %}

            <button type="submit" class="btn btn-primary">Save & Close</button>
            <a href="{% url 'renewal_view' renewal.id %}" class="btn btn-secondary">Cancel</a>
            <a href="{% url 'renewal_delete' renewal.id %}" class="btn btn-danger float-end">
                Delete
            </a>
        </form>
    </div>
</div>

<div id="autosave-status"
     class="alert alert-success mt-3"
     style="display:none;">
     Saved automatically
</div>

<script src="{% static 'js/renewal-form.js' %}"></script>
<script src="{% static 'js/autosave.js' %}"></script>
{% endblock %}
