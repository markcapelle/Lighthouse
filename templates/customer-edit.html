{% extends 'base.html' %}
{% load static %}
{% block content %}

<h2 class="mb-4">Edit Customer</h2>

<div class="card shadow">
<div class="card-body">

<form method="post" id="edit-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save & Close</button>

    <a href="{% url 'customer_view' customer.id %}" class="btn btn-secondary">
        Cancel
    </a>

    <a href="{% url 'customer_delete' customer.id %}" class="btn btn-danger">
        Delete
    </a>
</form>

<div id="autosave-status"
     class="alert alert-success mt-3"
     style="display:none;">
     Saved automatically
</div>

</div>
</div>

<script src="{% static 'js/autosave.js' %}"></script>

{% endblock %}
