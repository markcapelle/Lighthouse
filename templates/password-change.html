{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Change Password</h2>

<div class="card shadow">
<div class="card-body">

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save Password</button>

    {% if request.user.groups.all.0.name == "Administrator" and profile.id != request.user.profile.id %}
        <a href="{% url 'edit_user' profile.id %}" class="btn btn-secondary">Cancel</a>
    {% else %}
        <a href="{% url 'edit_profile' %}" class="btn btn-secondary">Cancel</a>
    {% endif %}
</form>

</div>
</div>
{% endblock %}
