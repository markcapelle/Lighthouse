{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Delete Product</h3>

<p>Are you sure you want to delete <strong>{{ product.productname }}</strong>?</p>

<form method="post">
{% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, Delete</button>
<a href="{% url 'product_edit' product.id %}" class="btn btn-secondary">No</a>
</form>

{% endblock %}
