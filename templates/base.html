<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lighthouse</title>

    {% load static %}

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    {% if request.user.is_authenticated %}
        {% include 'app-nav.html' %}
    {% else %}
        {% include 'web-nav.html' %}
    {% endif %}

    <main class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-primary text-light py-3 mt-auto">
        <div class="container text-center small">
            <p class="mb-1">© {{ now|date:"Y" }} Lighthouse</p>
            <p class="mb-0">
                <a href="/legal" class="text-decoration-none text-light">Legal</a> •
                <a href="/support" class="text-decoration-none text-light">Support</a> •
                <a href="/contact" class="text-decoration-none text-light">Team Admin Contact</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
