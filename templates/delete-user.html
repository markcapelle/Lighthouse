{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-3">
                    Delete User
                </h3>

                <p>
                    Are you sure you want to delete
                    <strong>
                        {{ profile.user.first_name }}
                        {{ profile.user.last_name }}
                    </strong>?
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Delete User
                    </button>

                    <a
                        href="{% url 'manage_users' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
