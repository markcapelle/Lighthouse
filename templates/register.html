{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Register</h2>

        <form method="post" class="card card-body shadow-sm">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="mb-3">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label>Password</label>
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                {{ form.password2 }}
            </div>

            <div class="mb-3">
                <label>Country Code</label>
                {{ form.countrycode }}
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                {{ form.phonenumber }}
            </div>

            <div class="mb-3">
                <label>Registration Type</label>
                {{ form.register_type }}
            </div>

            <div class="mb-3">
                <label>New Company Name</label>
                {{ form.company_name }}
            </div>

            <div class="mb-3">
                <label>Existing Company</label>
                {{ form.existing_company }}
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>
</div>
{% endblock %}
