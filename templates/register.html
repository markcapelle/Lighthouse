{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Register</h2>

        <form method="post" class="card card-body shadow-sm">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="mb-3">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label>Password</label>
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                {{ form.password2 }}
            </div>

            <div class="mb-3">
                <label>Country Code</label>
                {{ form.countrycode }}
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                {{ form.phonenumber }}
            </div>

            <div class="mb-3">
                <label>Registration Type</label>
                {{ form.register_type }}
            </div>

            <div class="mb-3" id="new-company-container">
                <label>New Company Name</label>
                {{ form.company_name }}
            </div>

            <div class="mb-3" id="existing-company-container">
                <label>Existing Company</label>
                {{ form.existing_company }}
            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Register
            </button>

        </form>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const registerType =
            document.getElementById("id_register_type");

        const newCompanyContainer =
            document.getElementById("new-company-container");

        const existingCompanyContainer =
            document.getElementById("existing-company-container");

        function toggleCompanyFields() {

            if (registerType.value === "new") {
                newCompanyContainer.style.display = "block";
                existingCompanyContainer.style.display = "none";
            } else {
                newCompanyContainer.style.display = "none";
                existingCompanyContainer.style.display = "block";
            }
        }

        toggleCompanyFields();

        registerType.addEventListener(
            "change",
            toggleCompanyFields
        );
    });
</script>
{% endblock %}
