{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <h2 class="mb-4">Edit Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- First Name -->
            <div class="mb-3">
                <label class="form-label">First Name</label>
                {{ form.first_name }}
            </div>

            <!-- Last Name -->
            <div class="mb-3">
                <label class="form-label">Last Name</label>
                {{ form.last_name }}
            </div>

            <!-- Country Code -->
            <div class="mb-3">
                <label class="form-label">Country Code</label>
                {{ form.countrycode }}
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                {{ form.phonenumber }}
            </div>

            <!-- Avatar Upload -->
            <div class="mb-3">
                <label class="form-label">Upload Avatar</label>
                {{ form.avatar }}
            </div>

            <!-- Clear Avatar -->
            <div class="form-check mb-3">
                {{ form.clear_avatar }}
                <label class="form-check-label">Clear avatar</label>
            </div>

            <!-- MFA Toggle -->
            <div class="mb-3">
                <label class="form-label">Multi-Factor Authentication</label>
                {{ form.mfa_enabled }}
            </div>

            <!-- BUTTONS -->
            <div class="d-flex gap-3 mt-3">
                <a href="{% url 'change_password' %}" class="btn btn-warning">
                    Change Password
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>
            </div>


        </form>

    </div>
</div>

{% endblock %}
