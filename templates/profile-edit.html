{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <h2 class="mb-4">
            Edit Profile
        </h2>

        <form method="post" class="card card-body shadow">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    First Name
                </label>
                {{ form.first_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Last Name
                </label>
                {{ form.last_name }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Country Code
                </label>
                {{ form.countrycode }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Phone Number
                </label>
                {{ form.phonenumber }}
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
