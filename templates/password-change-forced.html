{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Set a New Password</h2>

<div class="card shadow">
<div class="card-body">

<p class="text-muted">You must set a new password before continuing.</p>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label for="{{ form.password1.id_for_label }}">New Password</label>
        {{ form.password1 }}
    </div>

    <div class="mb-3">
        <label for="{{ form.password2.id_for_label }}">Confirm New Password</label>
        {{ form.password2 }}
    </div>

    <button type="submit" class="btn btn-primary">Update Password</button>
</form>

</div>
</div>
{% endblock %}
