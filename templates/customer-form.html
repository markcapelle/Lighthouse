{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    {{ title }}
</h2>

<div class="card shadow">
    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Customer Name
                </label>
                {{ form.customername }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Contact Name
                </label>
                {{ form.maincontactname }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>
                {{ form.maincontactemail }}
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Phone
                </label>
                {{ form.phonenumber }}
            </div>

            <button
                type="submit"
                class="btn btn-primary">
                Save
            </button>

            <a href="{% url 'customers' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
