{% load static %}

<table class="table table-striped table-hover mb-0">
    <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Product</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Start Date</th>
            <th>Next Renewal</th>
            <th>Price</th>
        </tr>
    </thead>

    <tbody>
        {% for r in renewals %}
        <tr>
            <td>
                <a href="{% url 'renewal_view' r.id %}" class="btn btn-outline-primary btn-sm">
                    {{ r.renewalname }}
                </a>
            </td>
            <td>{{ r.product.productname }}</td>
            <td>{{ r.customer.customername }}</td>
            <td>{{ r.status.name }}</td>
            <td>{{ r.startdate }}</td>

            <!-- IMPORTANT: ISO date for JS -->
            <td class="renewal-date"
                data-date="{{ r.next_renewal_date|date:'c' }}">
                {{ r.next_renewal_date }}
            </td>

            <td>€{{ r.customerprice }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- JS for renewal colouring -->
<script src="{% static 'js/renewals.js' %}"></script>
